function advance(){
  switch(S.phase){
    case "target":  setPhase("pick"); return 1700;
    case "pick":    S.opIn=""; setPhase("enter"); return 900;
    case "enter":   setPhase("cancel"); return 1900;
    case "cancel":  S.ansIn=""; setPhase("compute"); return 900;
    case "compute": setPhase("solved"); return 1000;
    case "solved":  Shell.demo.done=true; setPhase("check"); return 0;
    case "verify":  Shell.demo.done=true; setPhase("check"); return 0;
    default:        if(Shell.demo){ Shell.demo.done=true; render(); } return 0;
  }
}

function begin(level,saved,variant){
  clearTimers();
  S.p=saved || (variant==="mul" ? genMul() : variant==="div" ? genDiv() : genProblem()); S.phase="target";
  S.opIn=""; S.ansIn=""; S.chkIn=""; S.hint=false; S.clean=true; S.firstId=null; S.demoing=false; S.busy=false;
  Shell.started(KEY,null,S.p);
  render();
}

/* ============ input handling ============ */
function attach(){
  const hb=byId("hintBtn");
  if(hb) hb.onclick=function(){ S.hint=!S.hint; renderPrompt(); attach(); Shell.fit(); };
  const nb=byId("nextBtn");
  if(nb) nb.onclick=function(){ Shell.next(); };
  Shell.bindOps(chooseOp);
  Shell.bindTargets(chooseTarget);

  bind("opA",onOp); bind("opB",onOp);
  bind("ans",function(e){ S.ansIn=e.target.value; });
  bind("chk",function(e){ S.chkIn=e.target.value; });
}
function bind(id,handler){
  const el=byId(id);
  if(!el) return;
  el.oninput=function(e){ handler(e); autoCheck(id); };
  el.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(id); } };
}

/* every keystroke: a right answer moves on; if they keep typing after one, re-check what's there now */
function formsFor(id){
  const p=S.p;
  switch(id){
    case "opA": case "opB": return [String(p.a)];
    case "ans": return [String(p.sol)];
    case "chk": return [String(p.C)];
  }
  return null;
}
function cantBeRight(id){
  const el=byId(id), f=formsFor(id);
  return !!(el && f && !Shell.couldBe(el.value,f));
}
function wrongMsg(){
  const p=S.p;
  switch(S.phase){
    case "enter":   return "Not quite \u2014 it has to be the number with "+p.V+", sign and all.";
    case "compute": return "Not quite \u2014 that's not what that side works out to.";
    case "verify":  return "Not quite \u2014 work that side out again. It comes out to "+dash(p.C)+".";
  }
  return "Not quite.";
}
function autoCheck(id){
  if(Shell.locked || S.demoing) return;
  if(S.busy){
    clearTimers(); S.busy=false;
    document.querySelectorAll("#eq .box.ok, #panel .box.ok").forEach(function(b){ b.classList.remove("ok"); });
    ["slD","slN"].forEach(function(i){ const sl=byId(i); if(sl && sl.className==="slash draw") sl.className="pend"; });
  }
  /* a wrong answer counts the moment it's typed \u2014 no need to press Enter */
  if(cantBeRight(id)){ flagMiss(wrongMsg()); return; }
  submit(id,true);
  Shell.fit();
}
function chooseTarget(id,el){
  if(Shell.locked) return;
  if(id==="a"){ S.hint=false; setPhase("pick"); return; }
  Shell.shake(el); flagMiss(Shell.targetMiss(id,S.p.V));
}
function chooseOp(kind,btn){
  if(Shell.locked || S.busy) return;
  if(kind===S.p.needs){ S.hint=false; S.busy=true; Shell.fillBlank(btn,function(){ setPhase("enter"); }); return; }
  Shell.shake(btn);
  if(kind==="add"||kind==="sub"){
    flagMiss("Nothing is being added here — "+S.p.V+" is "
      +(S.p.needs==="divide" ? "multiplied by "+dash(S.p.a) : "divided by "+S.p.a)
      +", so adding or subtracting won't free it.");
  } else {
    flagMiss(S.p.needs==="divide"
      ? "That side is already a multiplication — multiplying again won't free "+S.p.V+". Division undoes it."
      : S.p.V+" is already being divided — dividing again won't free it. Multiplication undoes it.");
  }
}
function onOp(e){
  S.opIn=e.target.value;
  const other = e.target.id==="opA" ? byId("opB") : byId("opA");
  if(other && other.value!==S.opIn) other.value=S.opIn;
}

document.addEventListener("keydown",function(e){
  if(Shell.active!==KEY || Shell.locked || TI.isOpen()) return;
  if(e.key==="Enter" && S.phase==="check"){ e.preventDefault(); Shell.next(); }
});

return {
  start:begin, submit:submit, fill:fill, advance:advance, rerender:render,
  refresh:function(){ setPhase(S.phase); },
  demoMode:function(){ S.demoing=true; S.hint=false; S.busy=false; },
  phase:function(){ return S.phase; }, wantOp:function(){ return S.p.needs; }
};
})();


/* ================= frac ================= */
Shell.engines["frac"] = (function(){
const KEY="frac";

/* ============ formatting ============ */
const MINUS="−", TIMES="×";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function dash(s){return String(s).replace(/-/g,MINUS);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}

/* ============ parsing ============ */
function parseInt2(raw){
  if(raw===null||raw===undefined) return null;
  const s=String(raw).trim().replace(/[−–—]/g,"-").replace(/\s+/g,"");
  const m=s.match(/^([+-]?)(\d+)$/);
  if(!m) return null;
  return (m[1]==="-"?-1:1)*(+m[2]);
}
/* "6" or "7/3" — a top-heavy fraction is fine here, a mixed number is not */
function parseFracIn(raw){
  if(raw===null||raw===undefined) return null;
  const s=String(raw).trim().replace(/[−–—]/g,"-").replace(/\s+/g,"");
  let m;
  if((m=s.match(/^([+-]?)(\d+)\/(\d+)$/))){
    const d=+m[3];
    return d? {n:(m[1]==="-"?-1:1)*(+m[2]), d:d} : null;
  }
  if((m=s.match(/^([+-]?)(\d+)$/))) return {n:(m[1]==="-"?-1:1)*(+m[2]), d:1};
  return null;
}
/* "2 1/3" — a whole number and a leftover fraction */
function parseMixIn(raw){
  if(raw===null||raw===undefined) return null;
  const s=String(raw).trim().replace(/[−–—]/g,"-").replace(/\s+/g," ");
  const m=s.match(/^([+-]?)\s*(\d+)\s+(\d+)\/(\d+)$/);
  if(!m) return null;
  const d=+m[4];
  return d? {sg:(m[1]==="-"?-1:1), w:+m[2], n:+m[3], d:d} : null;
}

/* ============ problem generation ============ */
function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function properDivs(n){const out=[];for(let d=2;d<n;d++) if(n%d===0) out.push(d);return out;}
const VARS=["x","y","n","m","k","t","w","p","h","r","b","c"];

/* (s·a/b)V = C.  How much of the a cancels into C decides the shape of the problem:
   all of it  -> a whole-number answer
   some of it -> a fraction answer after a partial cancel
   none of it -> no cancelling step at all */
function genProblem(){
  const roll=Math.random();
  const kind = roll<0.45 ? "full" : (roll<0.60 ? "partial" : "none");
  for(let guard=0; guard<600; guard++){
    let a,b;
    if(kind==="partial"){                       /* a has to be composite to cancel part way */
      a=pick([4,6,8,9]);
      do{ b=rint(2,9); }while(b===a || gcd(a,b)!==1);
    } else {
      do{ b=rint(2,9); a=rint(2,9); }while(a===b || gcd(a,b)!==1);
    }
    const s=Math.random()<0.5?-1:1;
    let C;
    if(kind==="full"){
      C = a*rint(2,10)*(Math.random()<0.4?-1:1);
    } else if(kind==="partial"){
      const g=pick(properDivs(a)), rest=a/g, m=rint(2,9);
      if(gcd(m,rest)!==1) continue;
      C = g*m*(Math.random()<0.4?-1:1);
    } else {
      C = rint(2,15)*(Math.random()<0.4?-1:1);
      if(gcd(a,Math.abs(C))!==1) continue;
    }
    const g=gcd(a,Math.abs(C)), den=a/g, num=s*b*(C/g);
    if(Math.abs(C)>60 || Math.abs(num)>72) continue;
    return {a:a, b:b, s:s, C:C, num:num, den:den, V:pick(VARS), varLeft:Math.random()<0.5};
  }
  return {a:2,b:3,s:1,C:4,num:6,den:1,V:"x",varLeft:true};
}

/* ============ state ============ */
const S={
  p:null, phase:"target",
  numIn:"", denIn:"", simpDen:"", simpNum:"", ansIn:"", mixIn:"", chkIn:"",
  hint:false, clean:true, firstId:null, demoing:false, busy:false
};
const clearTimers=Shell.clearTimers, later=Shell.later;

function moved(){return S.phase!=="pick" && S.phase!=="target";}
function after(){return ["cancel","simplify","compute","mixed","solved","verify","check"].indexOf(S.phase)>=0;}
function reduced(){return ["compute","mixed","solved","verify","check"].indexOf(S.phase)>=0;}
function broughtDown(){return reduced();}
function solvedYet(){return ["solved","verify","check"].indexOf(S.phase)>=0;}

/* how much the two numbers share, and what is left after cancelling */
function gFac(){return gcd(S.p.a,Math.abs(S.p.C));}
function canSimp(){return gFac()>1;}
function redDen(){return S.p.a/gFac();}
function redNum(){return S.p.C/gFac();}
function improper(){return S.p.den>1 && Math.abs(S.p.num)>S.p.den;}
function wholePart(){return Math.trunc(Math.abs(S.p.num)/S.p.den);}
function restPart(){return Math.abs(S.p.num)%S.p.den;}
function ansText(){ const p=S.p; return p.den===1 ? String(p.num) : (p.num<0?"-":"")+Math.abs(p.num)+"/"+p.den; }
function mixText(){ return (S.p.num<0?"-":"")+wholePart()+" "+restPart()+"/"+S.p.den; }

/* ============ rendering pieces ============ */
function boxHTML(id,val,extra){
  return '<input id="'+id+'" class="box'+(extra||"")+'" value="'+esc(val)+'" autocomplete="off" spellcheck="false" inputmode="text">';
}
function previewHTML(id){ return '<span class="preview" id="'+id+'-pv"></span>'; }
function cell(html,cls){return '<div class="cell '+(cls||"")+'">'+html+'</div>';}
function dfrac(t,b){
  return '<span class="dfrac"><span class="t">'+t+'</span><span class="bar"></span><span class="b">'+b+'</span></span>';
}
/* the reciprocal sits on the outside of each side: far left on the left side, far right on the right */
function mgroup(mult,inner,tall,cls,before){
  const grp='<span class="paren">(</span>'+inner+'<span class="paren">)</span>';
  return '<span class="mgroup'+(tall?" tall":"")+' '+(cls||"")+'">'
       + (before ? mult+grp : grp+mult) + '</span>';
}
/* top-heavy form, the way it comes out of the multiplication */
function fracHTML(n,d){
  if(d===1) return dash(String(n));
  return (n<0?MINUS:"")+dfrac(Math.abs(n),d);
}
/* the same value written as a whole number and a leftover fraction */
function mixedHTML(n,d){
  if(d===1) return dash(String(n));
  const w=Math.trunc(Math.abs(n)/d), r=Math.abs(n)%d;
  if(w===0) return (n<0?MINUS:"")+dfrac(r,d);
  return '<span class="mixnum">'+(n<0?MINUS:"")+'<span class="whole">'+w+'</span>'+dfrac(r,d)+'</span>';
}
function slashCls(){
  return S.phase==="cancel" ? "slash draw" : (after() ? "slash dim" : "");
}
function coefHTML(cancelled){
  const p=S.p;
  const inner=(p.s<0?MINUS:"")+dfrac(p.a,p.b);
  return cancelled ? '<span class="'+slashCls()+'">'+inner+'</span>' : inner;
}
function recipHTML(cancelled){
  const p=S.p;
  const inner=(p.s<0?MINUS:"")+dfrac(p.b,p.a);
  return cancelled ? '<span class="'+slashCls()+'">'+inner+'</span>' : inner;
}
function fracBoxHTML(nId,dId){
  return '<span class="fracbox">'+boxHTML(nId,S.numIn," mini")
       + '<span class="bar"></span>'+boxHTML(dId,S.denIn," mini")+'</span>';
}
function recipOK(){
  const p=S.p, n=parseInt2(S.numIn), d=parseInt2(S.denIn);
  if(n===null||d===null||n===0||d===0) return false;
  return Math.abs(n)===p.b && Math.abs(d)===p.a && ((n*d>0)===(p.s>0));
}

/* ---- cross-simplifying the number side ---- */
function simpDenOK(){return parseInt2(S.simpDen)===redDen();}
function simpNumOK(){const v=parseInt2(S.simpNum); return v!==null && v===redNum();}
function simpOK(){return simpDenOK()&&simpNumOK();}
function simpPartial(){
  const dv=parseInt2(S.simpDen), nv=parseInt2(S.simpNum);
  if(dv===null||nv===null||dv<=redDen()) return false;
  const g=S.p.a/dv;
  return Number.isInteger(g) && g>1 && nv===S.p.C/g;
}
function recipCancelHTML(live){
  const p=S.p;
  const den='<span class="cx below"><span id="slD" class="'+(live?"pend":"slash cross")+'">'+p.a+'</span>'
    + '<span class="redu">'+(live?boxHTML("sd",S.simpDen," tiny"):String(redDen()))+'</span></span>';
  return (p.s<0?MINUS:"")+dfrac(p.b,den);
}
function constCancelHTML(live){
  return '<span class="cx above"><span class="redu">'
    + (live?boxHTML("sn",S.simpNum," tiny"):dash(redNum()))
    + '</span><span id="slN" class="'+(live?"pend":"slash cross")+'">'+dash(S.p.C)+'</span></span>';
}

function varSideHTML(nId,dId){
  const p=S.p;
  if(!moved()) return '<span class="tpair">'+Shell.mark(S.phase,coefHTML(false),"a","a")+Shell.mark(S.phase,p.V,"v","a")+'</span>';
  const term=coefHTML(after())+p.V;
  const mult = S.phase==="enter" ? fracBoxHTML(nId,dId) : recipHTML(true);
  return mgroup(mult,term,true,"fade",p.varLeft);
}
function numSideHTML(nId,dId){
  const p=S.p;
  if(!moved()) return Shell.mark(S.phase,dash(p.C),"c","a");
  const live = after() ? "blue" : "";
  if(canSimp()){
    if(S.phase==="simplify") return mgroup(recipCancelHTML(true),constCancelHTML(true),true,"roomy "+live,!p.varLeft);
    if(reduced()) return mgroup(recipCancelHTML(false),constCancelHTML(false),true,"roomy "+live,!p.varLeft);
  }
  const mult = S.phase==="enter" ? fracBoxHTML(nId,dId) : recipHTML(false);
  return mgroup(mult,dash(p.C),true,"fade "+live,!p.varLeft);
}

function renderEquation(){
  const p=S.p;
  const vCell = cell(p.varLeft?varSideHTML("nL","dL"):varSideHTML("nR","dR"));
  const nCell = cell(p.varLeft?numSideHTML("nR","dR"):numSideHTML("nL","dL"));
  const eCell = cell("=","eqsign");

  let html=(p.varLeft?[vCell,eCell,nCell]:[nCell,eCell,vCell]).join("");

  if(broughtDown()){
    html+='<div class="rule"></div>';
    let ansHTML;
    if(S.phase==="compute"){
      ansHTML = boxHTML("ans",S.ansIn,"")+previewHTML("ans");
    } else if(S.phase==="mixed"){
      ansHTML = '<span class="faint">'+fracHTML(p.num,p.den)+'</span><span class="faint">&rarr;</span>'
              + boxHTML("mix",S.mixIn," wide")+previewHTML("mix");
    } else {
      ansHTML = '<span class="green">'+mixedHTML(p.num,p.den)+'</span>';
    }
    const a1=cell('<span class="'+(solvedYet()?"green":"")+'">'+p.V+'</span>');
    const a2=cell("=","eqsign");
    const a3=cell(ansHTML);
    html+=(p.varLeft?[a1,a2,a3]:[a3,a2,a1]).join("");
  }
  byId("eq").innerHTML=html;
  if(S.phase==="enter") S.firstId = "nL";
}

function subHTML(){
  const p=S.p, solG='<span class="green">'+fracHTML(p.num,p.den)+'</span>';
  return coefHTML(false)+'<span class="paren">(</span>'+solG+'<span class="paren">)</span>';
}
function renderPanel(){
  const el=byId("panel"), p=S.p;
  if(S.phase==="pick"){
    el.innerHTML=Shell.opsHTML();
  } else if(S.phase==="verify" || S.phase==="check"){
    el.innerHTML=Shell.checkHTML({varLeft:p.varLeft, orig:coefHTML(false)+p.V,
      subbed:subHTML(), C:dash(p.C), box:boxHTML("chk",S.chkIn,"")+previewHTML("chk"), done:S.phase==="check"});
  } else {
    el.innerHTML="";
  }
}

function renderPrompt(){
  const el=byId("promptbar"), p=S.p, V=p.V;
  const hintBtn=Shell.hintBtn();
  const coef=coefHTML(false), rec=recipHTML(false);
  const negAns=(p.s<0)!==(p.C<0);
  let h="";

  if(S.phase==="target"){
    h='<div class="prompt"><span>What do we need to <strong>get rid of</strong>?</span></div>';
  }
  else if(S.phase==="pick"){
    h='<div class="prompt">'+Shell.pickPrompt("mul", "div")+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>'+V+' is multiplied by</span><span class="math">'+coef+'</span>'
      +'<span>. Division undoes multiplication &mdash; press \u00f7.</span></div>';
    h+='</div>';
  }
  else if(S.phase==="enter"){
    h='<div class="prompt"><span>To divide by a fraction, multiply by its <strong>reciprocal</strong> &mdash; flip it over. '
      +'Multiply both sides by the reciprocal of</span><span class="math">'+coef+'</span>'+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>Flip it over: '+p.b+' on top, '+p.a+' on the bottom. '
      +(p.s<0?'The coefficient is negative, so the reciprocal is negative too &mdash; type the sign on top.'
             :'The coefficient is positive, so the reciprocal is positive.')+'</span></div>';
    h+='</div>';
  }
  else if(S.phase==="cancel"){
    h='<div class="prompt"><span class="math">'+rec+'</span><span>'+TIMES+'</span><span class="math">'+coef+'</span>'
      +'<span>makes 1, so the coefficient is gone &mdash; leaving '+V+' alone.</span></div>';
  }
  else if(S.phase==="simplify"){
    h='<div class="prompt"><span><strong>Simplify before you multiply.</strong> '
      +p.a+' and '+Math.abs(p.C)+' share a factor &mdash; divide them both by it.</span>'+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>'+p.a+' &divide; '+gFac()+' = '+redDen()+', and '
      +Math.abs(p.C)+' &divide; '+gFac()+' = '+Math.abs(redNum())+'.'
      +(p.C<0?' The number stays negative.':'')
      +(redDen()>1?' They don\'t cancel all the way &mdash; '+redDen()+' is left underneath.':'')+'</span></div>';
    h+='</div>';
  }
  else if(S.phase==="compute"){
    const lead = p.den===1 ? 'The hard part is gone. Now multiply:'
      : (canSimp() ? 'It only cancelled part of the way, so the answer is a fraction:'
                   : 'Nothing cancels &mdash; '+p.a+' and '+Math.abs(p.C)
                     +' share no factors &mdash; so the answer is a fraction:');
    h='<div class="prompt"><span>'+lead+'</span>'
      +'<span class="math blue">'+fracHTML(p.s*p.b,p.den)+' '+TIMES+' '+dash(redNum())+'</span>'
      +(p.den===1?'':'<span class="faint">Type it like 7/3.</span>')+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>'+(p.den===1
      ? (canSimp()?'Because you cancelled first, these are small numbers. ':'')
      : 'Multiply the top numbers: '+Math.abs(p.s*p.b)+' '+TIMES+' '+Math.abs(redNum())+' = '
        +Math.abs(p.num)+', and keep '+p.den+' on the bottom. ')
      +(negAns?'One factor is negative, so the answer is negative.':'The signs match, so the answer is positive.')
      +'</span></div>';
    h+='</div>';
  }
  else if(S.phase==="mixed"){
    h='<div class="prompt"><span class="math">'+fracHTML(p.num,p.den)+'</span>'
      +'<span>is top-heavy. Write it as a mixed number.</span>'
      +'<span class="faint">Type it like 2 1/3.</span>'+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>'+p.den+' fits into '+Math.abs(p.num)+' '
      +wholePart()+' times, with '+restPart()+' left over'
      +(p.num<0?'. The answer stays negative':'')+'.</span></div>';
    h+='</div>';
  }
  else if(S.phase==="solved"){
    h='<div class="prompt"><span class="green"><strong>That\'s '+V+'. Here\'s the check.</strong></span></div>';
  }
  else if(S.phase==="verify"){
    h='<div class="prompt"><span>Check it: put</span><span class="math">'+fracHTML(p.num,p.den)
      +'</span><span>in for '+V+'. Work out that side &mdash; what does it come out to?</span>'
      +(improper()?'<span class="faint">The top-heavy form is the easy one to multiply.</span>':'')+hintBtn;
    if(S.hint) h+='<div class="hintline"><span>Multiply the tops and the bottoms, then simplify. If '+V
      +' is right, you get '+dash(p.C)+'.</span></div>';
    h+='</div>';
  }
  else if(S.phase==="check"){
    h='<div class="row-between"><div class="prompt"><span>Put</span><span class="math">'+fracHTML(p.num,p.den)
      +'</span><span>back in for '+V+' and both sides match.</span></div>'
      +'<button class="next" id="nextBtn" type="button">'+Shell.nextLabel()+'</button></div>';
  }
  el.innerHTML=h;
}

function updatePreview(id,asMixed){
  const pv=byId(id+"-pv");
  if(!pv) return;
  const box=byId(id);
  const raw=box?box.value:"";
  if(asMixed){
    const m=parseMixIn(raw);
    pv.innerHTML = m ? mixedHTML(m.sg*(m.w*m.d+m.n), m.d) : "";
  } else {
    const f=parseFracIn(raw);
    pv.innerHTML = (f && f.d!==1) ? fracHTML(f.n,f.d) : "";
  }
}

function render(){
  Shell.head(KEY); renderEquation(); renderPanel(); renderPrompt(); attach();
  updatePreview("ans",false); updatePreview("mix",true); updatePreview("chk",false);
  Shell.afterRender();
  focusFirst();
}
function focusFirst(){
  if(Shell.demo) return;
  later(60,function(){
    const el=S.firstId&&byId(S.firstId);
    if(el && !el.disabled) el.focus();
  });
}

/* ============ flow ============ */
function setPhase(ph){
  clearTimers();
  S.busy=false;
  S.phase=ph;
  if(ph==="enter") S.firstId="nL";
  else if(ph==="simplify") S.firstId="sd";
  else if(ph==="compute") S.firstId="ans";
  else if(ph==="mixed") S.firstId="mix";
  else if(ph==="verify") S.firstId="chk";
  else S.firstId=null;
  render();
  if(S.demoing) return;
  if(ph==="cancel") later(1900,function(){ setPhase(canSimp()?"simplify":"compute"); });
  if(ph==="solved") later(850,finish);
}
function describe(){
  const p=S.p;
  const term=(p.s<0?MINUS:"")+"("+p.a+"/"+p.b+")"+p.V;
  let ans;
  if(p.den===1) ans=dash(String(p.num));
  else {
    const w=Math.trunc(Math.abs(p.num)/p.den), r=Math.abs(p.num)%p.den;
    ans=(p.num<0?MINUS:"")+(w?w+" ":"")+r+"/"+p.den;
  }
  return {q: p.varLeft ? term+" = "+dash(p.C) : dash(p.C)+" = "+term, a: p.V+" = "+ans};
}
function finish(){
  Shell.solved(S.clean, describe());
  setPhase("check");
}
function flagMiss(msg){
  S.clean=false;
  Shell.missed(msg, describe());
}
function accept(ids,ms,fn){ S.busy=true; Shell.markOK(ids); later(ms,fn); }

function submit(fromId,auto){
  if(Shell.locked || S.busy || S.demoing) return;
  /* auto = called while typing: a right answer moves on, anything else waits for Enter */
  const ask=function(id,q){ if(!auto) Shell.askFor(id,q); },
        note=function(m){ if(!auto) Shell.note(m); },
        miss=function(m){ if(!auto) flagMiss(m); };
  const p=S.p, ph=S.phase;
  if(ph==="enter"){
    const right = fromId==="nR"||fromId==="dR";
    if(!S.numIn.trim()) return ask(right?"nR":"nL");
    if(!S.denIn.trim()){
      if(auto){
        const n=parseInt2(S.numIn);
        if((fromId==="nL"||fromId==="nR") && n!==null && Math.abs(n)===p.b){ const d=byId(right?"dR":"dL"); if(d) d.focus(); }
        return;
      }
      return Shell.askFor(right?"dR":"dL", fromId==="nL"||fromId==="nR");
    }
    if(parseInt2(S.numIn)===null || parseInt2(S.denIn)===null)
      return note("Type whole numbers — put a minus sign on top if it's negative.");
    if(recipOK()) return accept(["nL","nR","dL","dR"],320,function(){ S.hint=false; setPhase("cancel"); });
    return miss("Not quite — the reciprocal flips the fraction over and keeps its sign.");
  }
  if(ph==="simplify"){
    if(!S.simpDen.trim()) return ask("sd");
    if(!S.simpNum.trim()){
      if(auto){ if(fromId==="sd" && simpDenOK()){ const n=byId("sn"); if(n) n.focus(); } return; }
      return Shell.askFor("sn", fromId==="sd");
    }
    if(parseInt2(S.simpDen)===null || parseInt2(S.simpNum)===null) return note("Type whole numbers.");
    if(simpOK()){
      S.busy=true; Shell.markOK(["sd","sn"]);
      ["slD","slN"].forEach(function(id){ const s=byId(id); if(s) s.className="slash draw"; });
      later(560,function(){ S.hint=false; setPhase("compute"); });
      return;
    }
    if(simpPartial()) return Shell.note("That's a common factor, but not the biggest one — those two can still be cancelled further.");
    return miss("Not quite — divide "+p.a+" and "+Math.abs(p.C)+" by the biggest number that goes into both.");
  }
  if(ph==="compute"){
    if(!S.ansIn.trim()) return ask("ans");
    const f=parseFracIn(S.ansIn);
    if(!f) return note("Type it like 7/3 or -5.");
    if(f.n*p.den === p.num*f.d) return accept(["ans"],280,function(){ S.hint=false; setPhase(improper()?"mixed":"solved"); });
    return miss("Not quite — multiply the tops, keep the bottom, and watch the sign.");
  }
  if(ph==="mixed"){
    if(!S.mixIn.trim()) return ask("mix");
    const m=parseMixIn(S.mixIn);
    if(!m) return note("Type a whole number and a fraction, like 2 1/3.");
    if(m.d===p.den && m.w===wholePart() && m.n===restPart() && ((m.sg<0)===(p.num<0)))
      return accept(["mix"],280,function(){ S.hint=false; setPhase("solved"); });
    return miss("Not quite — "+p.den+" goes into "+Math.abs(p.num)+" "+wholePart()+" times with "+restPart()+" left over.");
  }
  if(ph==="verify"){
    if(!S.chkIn.trim()) return ask("chk");
    const f=parseFracIn(S.chkIn);
    if(!f) return note("Type it like 12 or 7/3.");
    if(f.n === p.C*f.d) return accept(["chk"],300,finish);
    return miss("Not quite — work that side out again. It comes out to "+dash(p.C)+".");
  }
}

/* the walk-through after a miss */
function fill(){
  const p=S.p;
  switch(S.phase){
    case "enter":    S.numIn=(p.s<0?"-":"")+p.b; S.denIn=String(p.a); break;
    case "simplify": S.simpDen=String(redDen()); S.simpNum=String(redNum()); break;
    case "compute":  S.ansIn=ansText(); break;
    case "mixed":    S.mixIn=mixText(); break;
    case "verify":   S.chkIn=String(p.C); break;
    default: return false;
  }
  sync({nL:S.numIn, nR:S.numIn, dL:S.denIn, dR:S.denIn, sd:S.simpDen, sn:S.simpNum, ans:S.ansIn, mix:S.mixIn, chk:S.chkIn});
  updatePreview("ans",false); updatePreview("mix",true); updatePreview("chk",false);
  return true;
}
function sync(vals){ Object.keys(vals).forEach(function(id){ const el=byId(id); if(el) el.value=vals[id]; }); }
function advance(){
  switch(S.phase){
    case "target":   setPhase("pick"); return 1700;
    case "pick":     S.numIn=""; S.denIn=""; setPhase("enter"); return 900;
    case "enter":    setPhase("cancel"); return 2000;
    case "cancel":   setPhase(canSimp()?"simplify":"compute"); return 900;
    case "simplify": setPhase("compute"); return 900;
    case "compute":  setPhase(improper()?"mixed":"solved"); return improper()?900:1000;
    case "mixed":    setPhase("solved"); return 1000;
    case "solved":   Shell.demo.done=true; setPhase("check"); return 0;
    case "verify":   Shell.demo.done=true; setPhase("check"); return 0;
    default:         if(Shell.demo){ Shell.demo.done=true; render(); } return 0;
  }
}

function begin(level,saved){
  clearTimers();
  S.p=saved || genProblem(); S.phase="target";
  S.numIn=""; S.denIn=""; S.simpDen=""; S.simpNum=""; S.ansIn=""; S.mixIn=""; S.chkIn="";
  S.hint=false; S.clean=true; S.firstId=null; S.demoing=false; S.busy=false;
  Shell.started(KEY,null,S.p);
  render();
}

/* ============ input handling ============ */
function attach(){
  const hb=byId("hintBtn");
  if(hb) hb.onclick=function(){ S.hint=!S.hint; renderPrompt(); attach(); Shell.fit(); };
  const nb=byId("nextBtn");
  if(nb) nb.onclick=function(){ Shell.next(); };
  Shell.bindOps(chooseOp);
  Shell.bindTargets(chooseTarget);

  ["nL","nR"].forEach(function(id){ bind(id,onNum); });
  ["dL","dR"].forEach(function(id){ bind(id,onDen); });
  bind("sd",function(e){ S.simpDen=e.target.value; });
  bind("sn",function(e){ S.simpNum=e.target.value; });
  bind("ans",function(e){ S.ansIn=e.target.value; updatePreview("ans",false); });
  bind("mix",function(e){ S.mixIn=e.target.value; updatePreview("mix",true); });
  bind("chk",function(e){ S.chkIn=e.target.value; updatePreview("chk",false); });
}
function bind(id,handler){
  const el=byId(id);
  if(!el) return;
  el.oninput=function(e){ handler(e); autoCheck(id); };
  el.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); submit(id); } };
}
/* every keystroke: a right answer moves on; if they keep typing after one, re-check what's there now */
function formsFor(id){
  const p=S.p, sg=function(v){ return v<0?"-":""; };
  const divs=[]; for(let g=2; g<=p.a; g++) if(p.a%g===0 && p.C%g===0) divs.push(g);
  switch(id){
    case "nL": case "nR": return [String(p.b), "-"+p.b];
    case "dL": case "dR": return [String(p.a), "-"+p.a];
    case "sd":  return divs.map(function(g){ return String(p.a/g); });
    case "sn":  return divs.map(function(g){ return String(p.C/g); });
    case "ans": { const o=[String(p.num)];
                  if(p.den>1) for(let k=1;k<=12;k++) o.push(sg(p.num)+Math.abs(p.num)*k+"/"+p.den*k);
                  return o; }
    case "mix": return [mixText()];
    case "chk": { const o=[String(p.C)]; for(let k=2;k<=12;k++) o.push(p.C*k+"/"+k); return o; }
  }
  return null;
}
function cantBeRight(id){
  const el=byId(id), f=formsFor(id);
  if(el && f && !Shell.couldBe(el.value,f)) return true;
  /* the reciprocal: both numbers right but the signs wrong */
  if(S.phase==="enter"){
    const n=parseInt2(S.numIn), d=parseInt2(S.denIn);
    if(n!==null && d!==null && Math.abs(n)===S.p.b && Math.abs(d)===S.p.a && !recipOK()) return true;
  }
  return false;
}
function wrongMsg(){
  const p=S.p;
  switch(S.phase){
    case "enter":    return "Not quite \u2014 the reciprocal flips the fraction over and keeps its sign.";
    case "simplify": return "Not quite \u2014 divide "+p.a+" and "+Math.abs(p.C)+" by the biggest number that goes into both.";
    case "compute":  return "Not quite \u2014 multiply the tops, keep the bottom, and watch the sign.";
    case "mixed":    return "Not quite \u2014 "+p.den+" goes into "+Math.abs(p.num)+" "+wholePart()+" times with "+restPart()+" left over.";
    case "verify":   return "Not quite \u2014 work that side out again. It comes out to "+dash(p.C)+".";
  }
  return "Not quite.";
}
function autoCheck(id){
  if(Shell.locked || S.demoing) return;
  if(S.busy){
    clearTimers(); S.busy=false;
    document.querySelectorAll("#eq .box.ok, #panel .box.ok").forEach(function(b){ b.classList.remove("ok"); });
    ["slD","slN"].forEach(function(i){ const sl=byId(i); if(sl && sl.className==="slash draw") sl.className="pend"; });
  }
  /* a wrong answer counts the moment it's typed \u2014 no need to press Enter */
  if(cantBeRight(id)){ flagMiss(wrongMsg()); return; }
  submit(id,true);
  Shell.fit();
}
function chooseTarget(id,el){
  if(Shell.locked) return;
  if(id==="a"){ S.hint=false; setPhase("pick"); return; }
  Shell.shake(el); flagMiss(Shell.targetMiss(id,S.p.V));
}
function chooseOp(kind,btn){
  if(Shell.locked || S.busy) return;
  /* dividing undoes the multiplication; with a fraction that is done by multiplying by the reciprocal,
     so ( ) is accepted too */
  if(kind==="divide" || kind==="multiply"){
    S.hint=false; S.busy=true;
    const div=byId("opDiv");
    Shell.fillBlank(div,function(){ setPhase("enter"); });
    return;
  }
  Shell.shake(btn);
    flagMiss("Nothing is being added here — "+S.p.V
      +" is multiplied by a fraction, so adding or subtracting won't free it.");
}
function mirror(ids,val){
  ids.forEach(function(id){
    const b=byId(id);
    if(b && b.value!==val) b.value=val;
  });
}
function onNum(e){ S.numIn=e.target.value; mirror(["nL","nR"],S.numIn); }
function onDen(e){ S.denIn=e.target.value; mirror(["dL","dR"],S.denIn); }

document.addEventListener("keydown",function(e){
  if(Shell.active!==KEY || Shell.locked || TI.isOpen()) return;
  if(e.key==="Enter" && S.phase==="check"){ e.preventDefault(); Shell.next(); }
});

return {
  start:begin, submit:submit, fill:fill, advance:advance, rerender:render,
  refresh:function(){ setPhase(S.phase); },
  demoMode:function(){ S.demoing=true; S.hint=false; S.busy=false; },
  phase:function(){ return S.phase; }, wantOp:function(){ return "divide"; }
};
})();


/* ============================================================
   Teaching preview: nothing to type. Each press of → or Enter
   shows the next step; ← steps back. No scores, nothing is sent.
   ============================================================ */
const TI = { isOpen:function(){ return false; }, served:0, record:function(){}, newProblem:function(){},
             wantsTurnIn:function(){ return false; }, nextLabel:function(){ return "Next problem &rarr;"; } };

const TABS = [["add","Addition"],["sub","Subtraction"],["mul","Multiplication"],["div","Division"],["mixed","Mixed"]];
Object.assign(Shell, { teach:true, tab:"add", steps:0, filled:false, reveal:false });

/* put a problem on the board, frozen so it only moves when you press a key */
function teachBegin(kind, level, saved){
  Shell.clearTimers();
  Shell.locked=true;
  Shell.demo={msg:"", ans:"", done:false};
  Shell.steps=0; Shell.filled=false; Shell.reveal=false; Shell.rowShown=null; Shell.checked=false;
  if(Shell.flyEl){ Shell.flyEl.remove(); Shell.flyEl=null; }
  Shell.note("");
  byId("panel").innerHTML="";
  const e=KIND_ENGINE[kind];
  Shell.kind=kind; Shell.active=e;
  Shell.engines[e].start(e==="addsub" ? level : undefined, saved||null, variantOf(kind));
  Shell.engines[e].demoMode();
  teachButtons();
}
/* a new problem in the current tab */
Shell.next = function(){
  const k = Shell.tab==="mixed" ? Shell.pickKind() : Shell.tab;
  /* adding & subtracting: mostly whole numbers, with decimals and fractions mixed in (like the drill) */
  const lv = KIND_ENGINE[k]==="addsub" ? (Shell.hard ? Shell.pickLevel() : 0) : null;
  teachBegin(k, lv, null);
  measureProblem();
};

/* As big as the screen allows. Run the problem through to the end once, out of sight, to find
   its biggest step; that sets one size for the whole problem so it never jumps or needs scrolling. */
Shell.need = null;
function measureProblem(){
  const c=Shell.current, box=byId("fitbox"), eq=byId("eq");
  Shell.measuring=true; box.style.visibility="hidden"; box.style.zoom="1";
  let w=0, h=0;
  const take=function(){ w=Math.max(w, eq.scrollWidth); h=Math.max(h, box.scrollHeight); };
  take();
  for(let guard=0; guard<40 && !Shell.checked; guard++){ Shell.step(); take(); }
  Shell.measuring=false;
  Shell.need={w:w, h:h};
  teachBegin(c.kind, c.level, c.p);
  box.style.visibility="";
  Shell.fit(); drawSlash();
}
Shell.fit = function(){
  const box=byId("fitbox"), work=document.querySelector(".work");
  if(!box || !work) return;
  if(Shell.measuring || !Shell.need){ box.style.zoom="1"; return; }
  const cs=getComputedStyle(work);
  const availH=work.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
  const availW=work.clientWidth;
  const k=Math.max(0.3, Math.min(availH/Shell.need.h, availW/Shell.need.w)*0.94);
  box.style.zoom=String(Math.floor(k*1000)/1000);
};
/* one press: ask the question, then show the answer, then move on */
Shell.step = function(){
  const eng=Shell.engines[Shell.active];
  if(!eng || !Shell.demo) return;
  if(Shell.demo.done){
    if(Shell.checked){ Shell.next(); return; }
    Shell.steps++;
    runCheck(Shell.replaying || Shell.measuring);
    teachButtons();
    return;
  }
  const ph=eng.phase();
  Shell.steps++;
  if(ph==="target" && !Shell.reveal){ Shell.reveal=true; eng.rerender(); }
  else if(Shell.rowShown!==null && Shell.rowShown<rowCells().length){ Shell.rowShown++; applyRow(); }
  else if(!Shell.filled && eng.fill()){ Shell.filled=true; sizeBoxes(); Shell.fit(); }
  else {
    Shell.filled=false; Shell.reveal=false; Shell.rowShown=null; eng.advance();
    /* with no sentences, naming the inverse shows nothing on the board, so go straight past it */
    if(eng.phase()==="pick"){ Shell.reveal=true; eng.advance(); Shell.reveal=false; }
    /* fractions: the common denominator shows up in the rewritten fractions, so go straight to them */
    if(eng.phase()==="lcd"){ eng.fill(); eng.advance(); }
    /* the answer is the last step: no check */
    if(eng.phase()==="solved") Shell.demo.done=true;
    /* the numbers go straight in with the step: no empty spaces waiting */
    if(!Shell.demo.done && eng.fill()){ Shell.filled=true; sizeBoxes(); Shell.fit(); }
    /* a new line of working (x = 5): write it one piece at a time, left to right */
    if(["compute","flip"].indexOf(eng.phase())>=0){ Shell.rowShown=1; applyRow(); }
  }
  teachButtons();
};
/* one step back: replay the same problem up to the step before */
Shell.back = function(){
  const c=Shell.current;
  if(!c || Shell.steps===0) return;
  const want=Shell.steps-1;
  teachBegin(c.kind, c.level, c.p);
  Shell.replaying=true;
  while(Shell.steps<want) Shell.step();
  Shell.replaying=false;
  teachButtons();
};
/* each box only as wide as the number in it, so "− 1" reads like writing */
function sizeBoxes(){
  document.querySelectorAll("#eq .box, #panel .box").forEach(function(b){
    if(b.value.indexOf("-")>=0) b.value=b.value.replace(/-/g,"\u2212");   /* a real minus sign, like the rest */
    /* exactly as wide as the number, so the sign sits right against it */
    const cs=getComputedStyle(b), cx=sizeBoxes.cx || (sizeBoxes.cx=document.createElement("canvas").getContext("2d"));
    cx.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
    b.style.width = Math.ceil(cx.measureText(b.value||"0").width+2) + "px";
  });
}
/* the newest line on the board: its cells in left-to-right order (blank spacer cells skipped) */
function rowCells(){
  const eq=byId("eq"), n=eq.classList.contains("k-addsub") ? 4 : 3;
  return Array.prototype.slice.call(eq.children, -n).filter(function(c){
    return c.classList.contains("cell") && !c.classList.contains("hide");
  });
}
function applyRow(){
  if(Shell.rowShown===null || Shell.rowShown===undefined) return;
  rowCells().forEach(function(c,i){ c.style.visibility = i<Shell.rowShown ? "" : "hidden"; });
}
/* one slash through both numbers that cancel (the 9 outside and the 9 underneath) */
function drawSlash(){
  const eq=byId("eq");
  eq.querySelectorAll(".xslash").forEach(function(e){ e.remove(); });
  if(!eq.classList.contains("k-muldiv")) return;
  const els=eq.querySelectorAll("span.cancelling, span.struck");
  if(els.length!==2) return;
  const cell=els[0].closest(".cell"); if(!cell) return;
  const cr=cell.getBoundingClientRect(); if(!cr.width) return;
  const k=cell.offsetWidth/cr.width;                 /* undo the fit-to-screen zoom */
  /* measure the digits only, so a minus sign in front (−8) doesn't pull the slash off the number */
  const digits=function(el){
    const w=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let t;
    while((t=w.nextNode())){
      const m=/[0-9]/.exec(t.nodeValue);
      if(m){ const rg=document.createRange(); rg.setStart(t,m.index); rg.setEnd(t,t.nodeValue.length);
             const r=rg.getBoundingClientRect(); if(r.width) return r; }
    }
    return el.getBoundingClientRect();
  };
  const pt=function(el){ const r=digits(el);
    return {x:(r.left+r.width/2-cr.left)*k, y:(r.top+r.height/2-cr.top)*k, h:r.height*k}; };
  let a=pt(els[0]), b=pt(els[1]);
  if(a.y>b.y){ const t=a; a=b; b=t; }                 /* a on top */
  /* stacked one over the other (5y over 5): run it straight through the middle of both numbers,
     tipping it just enough to read as a slash (top left, bottom right, away from the variable) */
  const ddx=b.x-a.x, ddy=b.y-a.y, minDx=0.2*Math.abs(ddy);
  if(Math.abs(ddx) < minDx){
    const mx=(a.x+b.x)/2;
    a.x = mx - minDx/2; b.x = mx + minDx/2;
  }
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
  const x1=a.x-ux*a.h*0.5, y1=a.y-uy*a.h*0.5, x2=b.x+ux*b.h*0.5, y2=b.y+uy*b.h*0.5;
  const full=Math.hypot(x2-x1,y2-y1);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","xslash "+(els[0].classList.contains("cancelling")?"draw":"done"));
  svg.setAttribute("width",cell.offsetWidth); svg.setAttribute("height",cell.offsetHeight);
  svg.innerHTML='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" style="--len:'+full+';stroke-dasharray:'+full+'"/>';
  cell.appendChild(svg);
}
/* After the answer: the work fades, the top line goes back to the original equation, the answer
   flies up into the variable's place, and a green check mark shows the statement is true. */
function runCheck(instant){
  const c=Shell.current, p=c.p, eq=byId("eq"), V=p.V;
  const n = eq.classList.contains("k-addsub") ? 4 : 3;
  const isAS = c.engine==="addsub";
  const sol = isAS ? p.sol.n/p.sol.d : p.sol;
  let solText = String(sol).replace(/-/g,"−");
  const mdash = function(x){ return String(x).replace(/-/g,"−"); };
  Shell.checked = true;

  /* where the answer is now: the number on the last line */
  const last = rowCells();
  const ansCell = last.filter(function(el){
    const t=el.textContent.trim(); return t && t!=="=" && t!==V && t!=="−"+V;
  }).pop();
  const ansEl = ansCell ? (ansCell.querySelector(".green") || ansCell) : null;
  const from = ansEl ? ansEl.getBoundingClientRect() : null;
  if(ansEl) solText = ansEl.innerHTML;          /* exactly as it's written on the bottom line */

  /* the top line goes back to the problem as it was first written */
  const top = Array.prototype.slice.call(eq.children, 0, n);
  if(isAS){
    top.forEach(function(el){ el.classList.remove("struck","cancelling","blue"); });
  } else {
    const vCell = top[p.varLeft?0:2], nCell = top[p.varLeft?2:0];
    vCell.innerHTML = p.needs==="divide"
      ? '<span class="tpair">'+mdash(p.a)+'<span>'+V+'</span></span>'
      : '<span class="dfrac"><span class="t"><span>'+V+'</span></span><span class="bar"></span><span class="b">'+p.a+'</span></span>';
    nCell.innerHTML = mdash(p.C);
    nCell.classList.remove("blue");
  }
  /* the letter in that line */
  let letter=null;
  top.some(function(cell){
    const w=document.createTreeWalker(cell, NodeFilter.SHOW_TEXT);
    let t;
    while((t=w.nextNode())){
      const i=t.nodeValue.lastIndexOf(V);
      if(i<0) continue;
      /* keep "−r" in one piece: the cell spaces out its parts, so give the text its own wrapper */
      if(t.parentNode.classList && t.parentNode.classList.contains("cell")){
        const wrap=document.createElement("span"); t.parentNode.replaceChild(wrap,t); wrap.appendChild(t);
      }
      const after=t.splitText(i); after.splitText(1);
      letter=document.createElement("span"); letter.className="vl";
      after.parentNode.replaceChild(letter, after); letter.textContent=V;
      return true;
    }
    return false;
  });
  /* everything under the top line steps back */
  Array.prototype.slice.call(eq.children, n).forEach(function(el){ el.classList.add("chk-fade"); });
  eq.querySelectorAll(".xslash").forEach(function(e){ e.remove(); });

  /* written in its place: brackets when it's negative, or sits right against a number or a minus */
  const tight = (isAS && p.negVar) || (!isAS && p.needs==="divide");
  const shown = (tight || sol<0) ? "("+solText+")" : solText;
  const land = function(){
    if(!letter) return;
    letter.innerHTML = shown;
    letter.className = "vl green";
    const tick=document.createElement("span");
    tick.className = "chk-tick" + (instant ? "" : " pop");
    tick.textContent = "✓";
    top[n-1].appendChild(tick);
    Shell.fit();
  };
  if(instant || !letter || !from){ land(); return; }

  /* the flight: a copy of the answer travels from the bottom line into the variable's spot */
  const box=byId("fitbox"), zk = box.getBoundingClientRect().width / (box.offsetWidth||1);
  const to = letter.getBoundingClientRect();
  const fly=document.createElement("div");
  fly.className="chk-fly"; fly.innerHTML=solText;
  fly.style.fontSize = (parseFloat(getComputedStyle(letter).fontSize)*zk)+"px";
  document.body.appendChild(fly);
  Shell.flyEl = fly;
  const fw=fly.offsetWidth, fh=fly.offsetHeight;
  fly.style.left=(from.left+from.width/2-fw/2)+"px";
  fly.style.top=(from.top+from.height/2-fh/2)+"px";
  if(ansEl) ansEl.style.visibility="hidden";
  letter.style.transition="opacity .3s";
  void fly.offsetWidth;
  fly.style.transform="translate("+((to.left+to.width/2)-(from.left+from.width/2))+"px,"
                                  +((to.top+to.height/2)-(from.top+from.height/2))+"px)";
  Shell.later(450,function(){ if(letter) letter.style.opacity="0"; });
  Shell.later(1000,function(){
    fly.remove(); Shell.flyEl=null;
    if(letter) letter.style.opacity="";
    land();
  });
}
function teachButtons(){
  byId("tbBack").disabled = Shell.steps===0;
  byId("tbNext").innerHTML = (Shell.demo && Shell.checked) ? "Next problem &rarr;" : "Next step &rarr;";
}

function drawTabs(){
  byId("tabs").innerHTML = TABS.map(function(t,i){
    return '<button class="tab-btn'+(t[0]===Shell.tab?' active':'')+'" type="button" role="tab" data-tab="'+t[0]
      +'" aria-selected="'+(t[0]===Shell.tab)+'" title="Press '+(i+1)+'">'+t[1]+'</button>';
  }).join("");
  byId("tabs").querySelectorAll(".tab-btn").forEach(function(b){
    b.onclick=function(){ b.blur(); setTab(b.getAttribute("data-tab")); };
  });
}
const DIFFS=[[false,"Easy"],[true,"Hard"]];
function drawDiff(){
  byId("diff").innerHTML = DIFFS.map(function(d){
    return '<button class="tab-btn'+(d[0]===!!Shell.hard?' active':'')+'" type="button" role="tab" data-hard="'+d[0]
      +'" aria-selected="'+(d[0]===!!Shell.hard)+'" title="Press '+d[1][0]+'">'+d[1]+'</button>';
  }).join("");
  byId("diff").querySelectorAll(".tab-btn").forEach(function(b){
    b.onclick=function(){ b.blur(); setDiff(b.getAttribute("data-hard")==="true"); };
  });
}
function setDiff(h){
  Shell.hard=h; Shell.bag=[]; Shell.recent=[];
  drawDiff(); Shell.next();
}
function setTab(t){
  Shell.tab=t; Shell.bag=[]; Shell.recent=[];
  drawTabs(); Shell.next();
}

/* → / Enter / Space / Page Down (presentation clickers) = next step;  ← / Page Up = back */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key;
  if(["ArrowRight","ArrowDown","Enter"," ","PageDown"].indexOf(k)>=0){
    e.preventDefault(); e.stopImmediatePropagation(); Shell.step();
  } else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].indexOf(k)>=0){
    e.preventDefault(); e.stopImmediatePropagation(); Shell.back();
  } else if(k==="n" || k==="N"){
    e.preventDefault(); Shell.next();
  } else if(k==="e" || k==="E"){
    e.preventDefault(); setDiff(false);
  } else if(k==="h" || k==="H"){
    e.preventDefault(); setDiff(true);
  } else if(/^[1-5]$/.test(k)){
    e.preventDefault(); setTab(TABS[+k-1][0]);
  }
},true);
/* clicking the board also moves on */
document.querySelector(".work").addEventListener("click",function(){ Shell.step(); });
byId("tbNext").onclick=function(){ this.blur(); Shell.step(); };
byId("tbBack").onclick=function(){ this.blur(); Shell.back(); };
byId("tbNew").onclick=function(){ this.blur(); Shell.next(); };
window.addEventListener("resize", function(){ Shell.fit(); drawSlash(); });

Shell.hard=false;
drawTabs();
drawDiff();
Shell.next();

</script>
